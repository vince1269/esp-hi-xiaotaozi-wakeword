name: Monitor ESP-SR wake word

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: monitor-esp-sr-xiaotaozi
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check ESP-SR
        id: monitor
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TRACKING_REPOSITORY: ${{ github.repository }}
        run: python monitor/monitor.py
      - name: Persist state
        if: always()
        run: |
          if ! git diff --quiet -- monitor/state.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add monitor/state.json
            git commit -m "chore: update wake-word monitor state"
            git push
          fi
      - name: Propagate monitor failure
        if: steps.monitor.outcome == 'failure'
        run: exit 1
